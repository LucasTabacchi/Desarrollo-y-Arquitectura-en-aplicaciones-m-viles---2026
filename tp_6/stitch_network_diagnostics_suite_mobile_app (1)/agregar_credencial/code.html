<!DOCTYPE html><html class="dark" lang="es" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-highest": "#2a3548", "primary-container": "#4d93e5", "error-container": "#93000a", "surface-variant": "#2a3548", "on-primary-fixed": "#001c39", "on-primary-fixed-variant": "#004883", "on-error": "#690005", "surface-container-high": "#1f2a3d", "outline": "#8b919d", "on-tertiary-fixed": "#002112", "primary-fixed": "#d4e3ff", "error": "#ffb4ab", "surface": "#071425", "tertiary-fixed-dim": "#42e09a", "surface-tint": "#a4c9ff", "on-secondary": "#00325a", "surface-container-low": "#101c2e", "primary": "#a4c9ff", "on-surface-variant": "#c1c7d3", "on-secondary-container": "#c7deff", "on-secondary-fixed": "#001c37", "surface-dim": "#071425", "secondary-fixed": "#d2e4ff", "on-surface": "#d7e3fc", "secondary": "#a0c9ff", "outline-variant": "#414751", "on-background": "#d7e3fc", "surface-container-lowest": "#030e20", "primary-fixed-dim": "#a4c9ff", "on-tertiary-container": "#00311d", "on-primary-container": "#002a51", "on-secondary-fixed-variant": "#00497f", "surface-bright": "#2e3a4d", "background": "#071425", "on-primary": "#00315d", "tertiary-container": "#00a56c", "secondary-container": "#0063aa", "on-error-container": "#ffdad6", "on-tertiary-fixed-variant": "#005233", "tertiary-fixed": "#65fdb5", "inverse-on-surface": "#253144", "secondary-fixed-dim": "#a0c9ff", "inverse-primary": "#0060ac", "inverse-surface": "#d7e3fc", "on-tertiary": "#003822", "tertiary": "#42e09a", "surface-container": "#142032" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-xs": "0.25rem", "space-sm": "0.5rem", "margin": "1rem", "gutter": "0.75rem", "space-lg": "1rem", "space-md": "0.75rem", "space-xl": "1.5rem" }, fontFamily: { "headline-sm": ["Manrope"], "label-lg": ["Geist"], "label-sm": ["Geist"], "headline-lg": ["Manrope"], "label-md": ["Geist"], "headline-xl": ["Manrope"], "body-sm": ["Geist"], "body-md": ["Geist"], "body-lg": ["Geist"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "700" }], "headline-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-xl": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between gap-space-xs"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Volver" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary transition-colors shrink-0" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">Agregar credencial</h1></div><div class="flex items-center gap-space-xs shrink-0"><div class="flex items-center gap-1.5 px-2 py-1 rounded bg-surface-container-high"><span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span><span class="font-label-sm text-label-sm text-tertiary uppercase">Online</span></div><div class="flex items-center px-2 py-1 rounded bg-surface-container-high"><span class="font-label-sm text-label-sm text-on-surface-variant font-mono">3 pend.</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 bg-surface flex-1 pb-safe"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Sub-header context banner -->
<div class="flex items-center gap-space-sm py-space-md mb-space-sm">
<div class="w-8 h-8 rounded-lg bg-surface-container-high flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-[20px]">vpn_key</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface">Agregar credencial</span>

</div>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-lg w-full" id="credential-form" onsubmit="event.preventDefault();">
<!-- Field 1: Equipo o host -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="host-field">
<span class="">Equipo o host</span>

</label>
<div class="relative flex items-center w-full">
<input autocapitalize="off" autocomplete="off" autocorrect="off" class="w-full h-12 px-space-md bg-surface-container-low text-on-surface font-mono text-[14px] leading-tight rounded-lg placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-colors shadow-inner" id="host-field" placeholder="192.168.1.1 o hostname" spellcheck="false" type="text">
</div>
</div>
<!-- Field 2: Puerto -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="port-field">
<span class="">Puerto</span>

</label>
<div class="relative flex items-center w-full">
<input class="w-full h-12 px-space-md bg-surface-container-low text-on-surface font-mono text-[14px] leading-tight rounded-lg placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-colors shadow-inner" id="port-field" max="65535" min="1" type="number" value="22">
</div>
</div>
<!-- Field 3: Usuario -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="user-field">
<span class="">Usuario</span>

</label>
<div class="relative flex items-center w-full">
<input autocapitalize="off" autocomplete="off" autocorrect="off" class="w-full h-12 px-space-md bg-surface-container-low text-on-surface font-body-md text-body-md leading-tight rounded-lg placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-colors shadow-inner" id="user-field" placeholder="admin" spellcheck="false" type="text">
</div>
</div>
<!-- Field 4: Contraseña -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="pwd-field">
<span class="">Contraseña</span>

</label>
<div class="relative flex items-center w-full">
<input autocomplete="new-password" class="w-full h-12 pl-space-md pr-12 bg-surface-container-low text-on-surface font-body-md text-body-md leading-tight rounded-lg placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-colors shadow-inner" id="pwd-field" placeholder="Contraseña" type="password">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-0 top-0 h-12 w-12 flex items-center justify-center text-outline hover:text-primary transition-colors focus:outline-none" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Security Note Card -->
<div class="flex items-start gap-space-sm p-space-md bg-surface-container rounded-xl shadow-sm mt-space-xs">
<div class="w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 text-tertiary">
<span class="material-symbols-outlined text-[16px]">lock</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed pt-0.5">
        La contraseña se guarda en Keychain/Keystore, nunca en texto plano.
      </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-space-sm mt-space-md">
<button class="w-full h-[52px] bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-lg flex items-center justify-center gap-space-xs active:bg-primary transition-colors shadow-md" id="btn-guardar" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
<span class="">Guardar</span>
</button>
<button class="w-full h-[48px] bg-surface-container text-on-surface-variant font-label-lg text-label-lg rounded-lg flex items-center justify-center active:bg-surface-container-high transition-colors" onclick="history.back()" type="button">
<span class="">Cancelar</span>
</button>
</div>
</form>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('pwd-field');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const saveBtn = document.getElementById('btn-guardar');
    if (saveBtn) {
      saveBtn.addEventListener('click', function(e) {
        e.preventDefault();
        saveBtn.classList.add('opacity-90');
        const originalText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Guardando...</span>';
        setTimeout(function() {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span><span>Guardado</span>';
          setTimeout(function() {
            history.back();
          }, 400);
        }, 600);
      });
    }
  })();
</script></main>

</body></html>
