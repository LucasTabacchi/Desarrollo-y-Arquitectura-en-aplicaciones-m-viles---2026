<script>
  document.querySelectorAll('input[name="selected_device"]').forEach(input => {

        const card = radio.closest('label');
        const iconContainer = card.querySelector('div > div:first-child');
        const led = card.querySelector('.shadow-\\[0_0_6px_rgba\\(164\\,201\\,255\\,0\\.8\\)\\]');
        
        if (radio.checked) {
          card.classList.remove('bg-surface-container-low');

          iconContainer.className = 'w-6 h-6 rounded-full bg-primary-container flex items-center justify-center shrink-0 transition-colors';

          if (!led) {
            const newLed = document.createElement('div');
            newLed.className = 'w-2.5 h-2.5 rounded-full bg-primary shrink-0 shadow-[0_0_6px_rgba(164,201,255,0.8)]';
            card.appendChild(newLed);
          }
        } else {
          card.classList.remove('bg-surface-container-high');
          card.classList.add('bg-surface-container-low');

      });
